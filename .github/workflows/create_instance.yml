- name: Launch OCI Instance via OCI CLI
      env:
        OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
        OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
        OCI_CLI_REGION: "sa-santiago-1"
      run: |
        # Install OCI CLI
        pip install oci-cli --quiet

        # Save SSH Public Key
        echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" | tr -d '\r' > ssh_key.pub

        # Get Availability Domain dynamically for sa-santiago-1
        AD_NAME=$(oci iam availability-domain list --query "data[0].name" --raw-output)
        echo "Target Availability Domain: $AD_NAME"

        # Try launching the instance
        oci compute instance launch \
          --availability-domain "$AD_NAME" \
          --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
          --shape "VM.Standard.A1.Flex" \
          --shape-config '{"ocpus": 4, "memory_in_gbs": 24}' \
          --image-id "${{ secrets.OCI_IMAGE_OCID }}" \
          --subnet-id "${{ secrets.OCI_SUBNET_OCID }}" \
          --ssh-authorized-keys-file ssh_key.pub \
          --assign-public-ip true \
          --display-name "ARM-Santiago-Instance"

name: OCI Instance Auto Provisioner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install

      - name: Create API Private Key File
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Execute OCI Provisioner
        run: |
          # Limpiamos saltos de línea y formateamos la clave SSH
          SSH_KEY=$(echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}" | tr -d '\r' | tr '\n' ' ' | xargs)

          export OCI_REGION="${{ secrets.OCI_REGION }}"
          export OCI_USER_ID="${{ secrets.OCI_USER_OCID }}"
          export OCI_TENANCY_ID="${{ secrets.OCI_TENANCY_OCID }}"
          export OCI_KEY_FINGERPRINT="${{ secrets.OCI_FINGERPRINT }}"
          export OCI_PRIVATE_KEY_FILENAME="key.pem"
          export OCI_SUBNET_ID="${{ secrets.OCI_SUBNET_OCID }}"
          export OCI_IMAGE_ID="${{ secrets.OCI_IMAGE_OCID }}"
          export OCI_AVAILABILITY_DOMAIN=""
          export OCI_OCPUS="4"
          export OCI_MEMORY_IN_GBS="24"
          export OCI_SHAPE="VM.Standard.A1.Flex"
          export OCI_MAX_INSTANCES_IN_ANY_STATE="1"
          export OCI_SSH_PUBLIC_KEY="$SSH_KEY"
          
          # Aliases de compatibilidad
          export OCI_KEY_FILE="key.pem"
          export OCI_USER_OCID="${{ secrets.OCI_USER_OCID }}"
          export OCI_TENANCY_OCID="${{ secrets.OCI_TENANCY_OCID }}"
          export OCI_FINGERPRINT="${{ secrets.OCI_FINGERPRINT }}"
          export OCI_SUBNET_OCID="${{ secrets.OCI_SUBNET_OCID }}"
          export OCI_IMAGE_OCID="${{ secrets.OCI_IMAGE_OCID }}"

          # Diagnóstico rápido de variables no confidenciales
          echo "Subnet OCID configurado: $OCI_SUBNET_ID"
          echo "Image OCID configurado: $OCI_IMAGE_ID"
          
          php index.php
